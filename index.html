<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Surprise 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: "Archivo", sans-serif; }
        
        /* Slide 1: Question Screen */
        #slide1 {
            background: linear-gradient(180deg, rgba(255, 208, 229, 1) 0%, rgba(255, 232, 242, 1) 36%, rgba(255, 255, 255, 1) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100vw; transition: opacity 0.8s ease;
        }

        /* Slide 2: Heart Animation */
        #slide2 {
            background: #101010;
            display: none; height: 100vh; width: 100vw; position: relative;
        }

        canvas { position: absolute; width: 100%; height: 100%; }

        .namebox {
            color: #fff; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center; pointer-events: none;
        }
        .namebox h1 { font-family: "Pacifico", cursive; font-size: 3.5rem; margin: 0; text-shadow: 0 0 20px #ff30c5; }
        
        .copy-link { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); }
        .copy-link a { color: #ff30c5; text-decoration: none; font-size: 1.2rem; }

        .bounce2 { animation: bounce2 2s ease infinite; }
        @keyframes bounce2 {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div id="slide1">
        <div class="flex flex-col items-center p-4">
            <img id="imageDisplay" src="./images/image1.gif" alt="Cute kitten" class="rounded-md h-[300px] object-cover" />
            <h2 id="valentineQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4 text-center">Will you be my Valentine?</h2>
            <div class="flex gap-4 pt-[20px] items-center" id="responseButtons">
                <button id="yesButton" class="bounce2 inline-flex items-center justify-center rounded-xl text-[20px] font-medium bg-green-500 text-white px-8 py-4 hover:bg-green-400 transition-all duration-300">Yes</button>
                <button id="noButton" class="inline-flex items-center justify-center rounded-xl text-[20px] font-medium bg-red-500 text-white px-4 py-2 hover:bg-red-700 transition-all duration-300">No</button>
            </div>
        </div>
    </div>

    <div id="slide2">
        <canvas id="pinkboard"></canvas>
        <div class="namebox">
            <h1>Rayu❤️yuvii</h1>
        </div>
        <div class="copy-link">
            <a href="https://www.instagram.com/raviiiii______x">@raviiiii______x</a>
        </div>
    </div>

    <script type="module">
        import confetti from 'https://cdn.skypack.dev/canvas-confetti';

        const yesBtn = document.getElementById('yesButton');
        const noBtn = document.getElementById('noButton');
        const slide1 = document.getElementById('slide1');
        const slide2 = document.getElementById('slide2');
        const imageDisplay = document.getElementById('imageDisplay');
        const valentineQuestion = document.getElementById('valentineQuestion');

        let noCount = 0;
        let buttonHeight = 48;
        let buttonWidth = 80;
        let fontSize = 20;

        // Aapki images ke paths
        const imagePaths = [
            "./images/image1.gif",
            "./images/image2.gif",
            "./images/image3.gif",
            "./images/image4.gif",
            "./images/image5.gif",
            "./images/image6.gif",
            "./images/image7.gif"
        ];

        noBtn.addEventListener('click', function () {
            if (noCount < 5) {
                noCount++;
                imageDisplay.src = imagePaths[noCount]; // Pic change hogi
                
                buttonHeight += 20;
                buttonWidth += 35;
                fontSize += 10;
                yesBtn.style.height = `${buttonHeight}px`;
                yesBtn.style.width = `${buttonWidth}px`;
                yesBtn.style.fontSize = `${fontSize}px`;
                
                noBtn.textContent = ["No", "Are you sure?", "Pookie please", "Don't do this to me :(", "You're breaking my heart", "I'm gonna cry..."][noCount];
            }
        });

        yesBtn.addEventListener('click', () => {
            imageDisplay.src = './images/image7.gif'; 
            confetti(); 
            valentineQuestion.textContent = "Yayyyy! I knew it! ❤️";
            
            // Step complete hone ke baad Slide 2 par switch
            setTimeout(() => {
                slide1.style.opacity = '0';
                setTimeout(() => {
                    slide1.style.display = 'none';
                    slide2.style.display = 'block';
                    startHeartAnimation(); 
                }, 800);
            }, 2000); // 2 seconds wait karega taaki "Yay" message dikhe
        });

        function startHeartAnimation() {
            // ... (Heart animation logic same as before) ...
            var settings = { particles: { length: 500, duration: 2, velocity: 100, effect: -0.75, size: 30 } };
            var canvas = document.getElementById('pinkboard');
            var context = canvas.getContext('2d');
            function onResize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
            window.onresize = onResize;
            onResize();
            function pointOnHeart(t) {
                return {
                    x: 160 * Math.pow(Math.sin(t), 3),
                    y: 130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
                };
            }
            var image = (function() {
                var c = document.createElement('canvas'), ctx = c.getContext('2d');
                c.width = c.height = settings.particles.size;
                ctx.beginPath();
                for(let t=-Math.PI; t<=Math.PI; t+=0.01) {
                    let p = pointOnHeart(t);
                    let x = settings.particles.size/2 + p.x * settings.particles.size/350;
                    let y = settings.particles.size/2 - p.y * settings.particles.size/350;
                    t === -Math.PI ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                }
                ctx.fillStyle = '#ff30c5'; ctx.fill();
                var img = new Image(); img.src = c.toDataURL(); return img;
            })();
            let particles = [];
            function render() {
                requestAnimationFrame(render);
                context.clearRect(0,0,canvas.width,canvas.height);
                let p = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
                particles.push({x: canvas.width/2 + p.x, y: canvas.height/2 - p.y, age: 0, vx: p.x/10, vy: -p.y/10});
                for(let i=0; i<particles.length; i++) {
                    let pt = particles[i];
                    pt.x += pt.vx * 0.05; pt.y += pt.vy * 0.05; pt.age += 0.01;
                    context.globalAlpha = 1 - pt.age/2;
                    context.drawImage(image, pt.x, pt.y, 20, 20);
                    if(pt.age > 2) { particles.splice(i, 1); i--; }
                }
            }
            render();
        }
    </script>
</body>
</html>
